<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#25282b" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>"
    />
    <title>ACC PORTAL</title>

    <style>
      :root {
        --bg: #25282b;
        --bg-deep: #17191b;
        --card: #2d3033;
        --cream: #fff3df;
        --paper: #f0e9dc;
        --ink: #27211c;
        --orange: #e77a32;
        --orange-light: #ffab5c;
        --brown: #6e3d24;
        --green: #516b45;
        --gold: #f5c95f;
      }

      * {
        box-sizing: border-box;
        font-family: "Comic Sans MS", "Comic Sans", cursive;
      }

      html {
        min-height: 100%;
        background: var(--bg-deep);
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--cream);
        background:
          radial-gradient(circle at 18% 10%, rgba(231, 122, 50, 0.19), transparent 25rem),
          radial-gradient(circle at 82% 88%, rgba(81, 107, 69, 0.24), transparent 29rem),
          linear-gradient(135deg, #34383c 0%, var(--bg) 47%, var(--bg-deep) 100%);
      }

      *::selection {
        color: var(--ink);
        background: var(--gold);
      }

      .portal-shell {
        position: relative;
        z-index: 2;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 86px 112px;
      }

      .border-decoration {
        position: fixed;
        z-index: 0;
        pointer-events: none;
        user-select: none;
        opacity: 0.95;
      }

      .corner-art {
        max-width: 270px;
        color: var(--orange-light);
        font-size: clamp(2rem, 4vw, 4.2rem);
        line-height: 1.08;
        letter-spacing: 0.05em;
        text-shadow: 2px 3px 0 rgba(0, 0, 0, 0.28);
      }

      .top-left {
        top: 17px;
        left: 24px;
        transform: rotate(-9deg);
      }

      .top-right {
        top: 15px;
        right: 26px;
        transform: rotate(10deg);
      }

      .bottom-left {
        bottom: 14px;
        left: 23px;
        transform: rotate(8deg);
      }

      .bottom-right {
        right: 24px;
        bottom: 14px;
        transform: rotate(-8deg);
      }

      .forest-strip {
        position: fixed;
        z-index: 0;
        left: 0;
        right: 0;
        height: 48px;
        overflow: hidden;
        color: rgba(255, 171, 92, 0.63);
        font-size: 2rem;
        line-height: 1.1;
        letter-spacing: 0.55rem;
        white-space: nowrap;
        text-align: center;
        text-shadow: 1px 2px 0 rgba(0, 0, 0, 0.3);
        pointer-events: none;
        user-select: none;
      }

      .forest-top {
        top: 7px;
      }

      .forest-bottom {
        bottom: 5px;
      }

      .fox-sticker {
        position: fixed;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 92px;
        height: 92px;
        border: 3px dashed var(--orange-light);
        border-radius: 50%;
        background: rgba(30, 33, 35, 0.84);
        color: var(--orange-light);
        font-size: 3.65rem;
        line-height: 1;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
        pointer-events: none;
        user-select: none;
      }

      .fox-one {
        top: 103px;
        left: 18px;
        transform: rotate(-10deg);
      }

      .fox-two {
        right: 18px;
        bottom: 99px;
        transform: rotate(11deg);
      }

      .portal-card {
        position: relative;
        z-index: 3;
        width: min(1150px, 100%);
        padding: 20px;
        border: 4px solid var(--orange);
        border-radius: 27px;
        background: rgba(45, 48, 51, 0.96);
        box-shadow:
          0 20px 56px rgba(0, 0, 0, 0.46),
          0 0 0 8px rgba(245, 201, 95, 0.14);
      }

      .portal-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-bottom: 18px;
        text-align: center;
      }

      .portal-header h1 {
        margin: 0;
        color: var(--cream);
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1;
        letter-spacing: 0.05em;
        text-shadow: 3px 4px 0 var(--brown);
      }

      .header-fox {
        color: var(--orange-light);
        font-size: clamp(2.3rem, 5vw, 4.2rem);
        line-height: 1;
        filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.22));
      }

      .document-wrap {
        min-height: 720px;
        overflow: hidden;
        border: 7px solid var(--cream);
        border-radius: 16px;
        background: var(--paper);
        box-shadow: inset 0 0 0 3px var(--brown);
      }

      .document-wrap iframe {
        display: block;
        width: 100%;
        height: 720px;
        border: 0;
        background: white;
      }

      .document-button-wrap {
        display: flex;
        justify-content: center;
        margin-top: 18px;
      }

      .document-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        padding: 0.8rem 1.3rem;
        border: 3px solid var(--cream);
        border-radius: 999px;
        color: var(--ink);
        background: var(--gold);
        box-shadow:
          0 5px 0 var(--brown),
          0 9px 14px rgba(0, 0, 0, 0.26);
        font-size: 1.05rem;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.02em;
        text-decoration: none;
        cursor: pointer;
        transform: translateY(0) scale(1);
        transition:
          transform 160ms ease,
          background-color 160ms ease,
          box-shadow 160ms ease;
      }

      .document-button:hover {
        background: var(--orange-light);
        box-shadow:
          0 6px 0 var(--brown),
          0 11px 18px rgba(0, 0, 0, 0.3);
        transform: translateY(-2px) scale(1.06);
      }

      .document-button:active {
        animation: button-pop 260ms ease-in-out;
        box-shadow:
          0 2px 0 var(--brown),
          0 4px 8px rgba(0, 0, 0, 0.22);
      }

      .document-button:focus-visible {
        outline: 4px solid var(--orange-light);
        outline-offset: 4px;
      }

      @keyframes button-pop {
        0% {
          transform: translateY(-2px) scale(1.06);
        }

        45% {
          transform: translateY(1px) scale(0.92);
        }

        75% {
          transform: translateY(-1px) scale(1.04);
        }

        100% {
          transform: translateY(0) scale(1);
        }
      }

      .portal-footer {
        margin: 14px 0 0;
        color: var(--gold);
        font-size: 1rem;
        text-align: center;
      }

      @media (prefers-reduced-motion: reduce) {
        .document-button {
          transition: none;
        }

        .document-button:active {
          animation: none;
        }
      }

      @media (max-width: 760px) {
        .portal-shell {
          padding: 76px 21px;
        }

        .portal-card {
          padding: 12px;
          border-radius: 19px;
        }

        .portal-header {
          gap: 8px;
          margin-bottom: 12px;
        }

        .document-wrap {
          min-height: 600px;
          border-width: 5px;
        }

        .document-wrap iframe {
          height: 600px;
        }

        .document-button {
          width: 100%;
          max-width: 340px;
          padding: 0.9rem 1rem;
        }

        .corner-art {
          font-size: 1.55rem;
        }

        .forest-strip {
          font-size: 1.25rem;
          letter-spacing: 0.25rem;
        }

        .fox-sticker {
          width: 58px;
          height: 58px;
          border-width: 2px;
          font-size: 2.35rem;
        }

        .fox-one {
          top: 65px;
          left: 6px;
        }

        .fox-two {
          right: 6px;
          bottom: 65px;
        }
      }
    </style>
  </head>

  <body>
    <div class="border-decoration top-left">
      <div class="corner-art">🍂 ✦ 🍄<br />🌿 🐾 🌙</div>
    </div>

    <div class="border-decoration top-right">
      <div class="corner-art">🌙 🐾 🌿<br />🍄 ✦ 🍂</div>
    </div>

    <div class="border-decoration bottom-left">
      <div class="corner-art">🌿 🍄 ✦<br />🐾 🍂 🌙</div>
    </div>

    <div class="border-decoration bottom-right">
      <div class="corner-art">✦ 🍄 🌿<br />🌙 🍂 🐾</div>
    </div>

    <div class="forest-strip forest-top">
      🌲 🍂 ✦ 🌿 🍄 🐾 🌙 🌲 🍂 ✦ 🌿 🍄 🐾 🌙 🌲 🍂 ✦ 🌿 🍄 🐾 🌙
    </div>

    <div class="forest-strip forest-bottom">
      🍄 🌿 🐾 ✦ 🍂 🌲 🌙 🍄 🌿 🐾 ✦ 🍂 🌲 🌙 🍄 🌿 🐾 ✦ 🍂 🌲 🌙
    </div>

    <div class="fox-sticker fox-one">🦊</div>
    <div class="fox-sticker fox-two">🦊</div>

    <main class="portal-shell">
      <section class="portal-card" aria-label="ACC PORTAL">
        <header class="portal-header">
          <span class="header-fox" aria-hidden="true">🦊</span>
          <h1>ACC PORTAL</h1>
          <span class="header-fox" aria-hidden="true">🦊</span>
        </header>

        <div class="document-wrap">
          <iframe
            title="ACC PORTAL Google Document"
            src="https://docs.google.com/document/d/e/2PACX-1vQcCGyuWvcmhwIpYA8ztDqYoY43qCkuH5OBHZ7R-mb2oD5PYLzyv5bxBlbo5Nvppxu248mKJEEHFSYc/pub?embedded=true"
            loading="lazy"
          >
          </iframe>
        </div>

        <div class="document-button-wrap">
          <a
            class="document-button"
            href="https://docs.google.com/document/d/13cwpLuxjcawMyskjnR9aZV3lkp0A9Eo3QV1OdxNldok/edit?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
          >
            📄 Open in a new tab ↗
          </a>
        </div>

        <p class="portal-footer">
          ✦ Welcome to the fox den — your activities, slides, and updates live
          here. ✦
        </p>
      </section>
    </main>
  </body>
</html>
