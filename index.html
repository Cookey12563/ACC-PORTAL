<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Use UTF-8 characters, including the emoji used throughout the portal. -->
    <meta charset="UTF-8" />

    <!-- Make layout dimensions responsive on phones and other small screens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Sets the browser UI color on supported mobile browsers. Updated by JavaScript per theme. -->
    <meta name="theme-color" content="#f5e4c5" />

    <script>
      /*
        Apply the saved/system-preferred theme before the page renders.

        Running this in <head> prevents a visible “flash” of the wrong theme
        while the page loads. A saved choice takes priority over the operating
        system’s light/dark preference.
      */
      (() => {
        const savedTheme = localStorage.getItem("acc-portal-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = savedTheme || (prefersDark ? "dark" : "light");

        // CSS uses html[data-theme="dark"] to activate the dark color variables.
        if (theme === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>

    <!-- Inline SVG favicon, so no separate image file is needed. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>"
    />

    <title>ACC PORTAL</title>

    <style>
      /*
        Light-theme design tokens.

        Using CSS custom properties makes it easy to maintain the palette:
        components use variables instead of hard-coded colors.
      */
      :root {
        color-scheme: light;

        --bg: #f5e4c5;
        --bg-deep: #d7b98a;
        --card: #fff3df;
        --cream: #e1ded8;
        --paper: #fffaf0;
        --ink: #27211c;
        --orange: #c96022;
        --orange-light: #f7b45d;
        --brown: #6e3d24;
        --green: #516b45;
        --gold: #f5c95f;

        /* Layered gradients create the warm, illustrated page background. */
        --page-gradient:
          radial-gradient(circle at 18% 10%, rgba(255, 180, 86, 0.52), transparent 25rem),
          radial-gradient(circle at 82% 88%, rgba(100, 132, 82, 0.3), transparent 29rem),
          linear-gradient(135deg, #fff7e8 0%, var(--bg) 47%, var(--bg-deep) 100%);

        /* Frame colors around the embedded Google Document. */
        --frame: #242628;
        --frame-outer-outline: #e1ded8;
        --frame-inner-outline: #e1ded8;
        --iframe-fallback: #ffffff;

        /* Theme-toggle button colors for light mode. */
        --theme-button-bg: #17385f;
        --theme-button-hover: #214d80;
        --theme-button-border: #9bc7ff;
        --theme-button-shadow: #0b1d33;
        --theme-button-icon: #d8eaff;
      }

      /*
        Dark-theme overrides.

        This selector becomes active when JavaScript adds:
        <html data-theme="dark">
      */
      html[data-theme="dark"] {
        color-scheme: dark;

        --bg: #25282b;
        --bg-deep: #17191b;
        --card: #2d3033;
        --cream: #fff3df;
        --paper: #f0e9dc;
        --ink: #27211c;
        --orange: #e77a32;
        --orange-light: #ffab5c;
        --brown: #6e3d24;
        --green: #516b45;
        --gold: #f5c95f;

        --page-gradient:
          radial-gradient(circle at 18% 10%, rgba(231, 122, 50, 0.19), transparent 25rem),
          radial-gradient(circle at 82% 88%, rgba(81, 107, 69, 0.24), transparent 29rem),
          linear-gradient(135deg, #34383c 0%, var(--bg) 47%, var(--bg-deep) 100%);

        --frame: #242628;
        --frame-outer-outline: #fff3df;
        --frame-inner-outline: #fff3df;
        --iframe-fallback: #ffffff;

        /* Theme-toggle colors change so the button looks like a light-mode control. */
        --theme-button-bg: #fff1a8;
        --theme-button-hover: #ffe67a;
        --theme-button-border: #c68019;
        --theme-button-shadow: #8e5513;
        --theme-button-icon: #8a5200;
      }

      /*
        Global reset:
        - Makes width/height calculations include padding and borders.
        - Applies the portal’s playful font to all elements.
      */
      * {
        box-sizing: border-box;
        font-family: "Comic Sans MS", "Comic Sans", cursive;
      }

      /* Ensures the background fills even if the page content is short. */
      html {
        min-height: 100%;
        background: var(--bg-deep);
      }

      /*
        Main page canvas.
        Horizontal overflow is disabled because decorative fixed elements may
        otherwise create unwanted side-scrolling on narrow screens.
      */
      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--cream);
        background: var(--page-gradient);
        transition: background 240ms ease, color 240ms ease;
      }

      /* Custom highlight colors when users select text. */
      *::selection {
        color: var(--ink);
        background: var(--gold);
      }

      /*
        Centers the portal card both vertically and horizontally.
        The high z-index keeps core content above background decorations.
      */
      .portal-shell {
        position: relative;
        z-index: 2;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 86px 112px;
      }

      /*
        Shared base styles for the four decorative corner groups.
        pointer-events: none ensures decorative emoji never block clicks.
      */
      .border-decoration {
        position: fixed;
        z-index: 0;
        pointer-events: none;
        user-select: none;
        opacity: 0.95;
      }

      /* Typography for the corner emoji clusters. */
      .corner-art {
        max-width: 270px;
        color: var(--orange-light);
        font-size: clamp(2rem, 4vw, 4.2rem);
        line-height: 1.08;
        letter-spacing: 0.05em;
        text-shadow: 2px 3px 0 rgba(0, 0, 0, 0.28);
      }

      /* Unique position and rotation for each corner decoration. */
      .top-left { top: 17px; left: 24px; transform: rotate(-9deg); }
      .top-right { top: 15px; right: 96px; transform: rotate(10deg); }
      .bottom-left { bottom: 14px; left: 23px; transform: rotate(8deg); }
      .bottom-right { right: 24px; bottom: 14px; transform: rotate(-8deg); }

      /*
        Repeating emoji strips at the top and bottom of the viewport.
        They stay fixed while the portal content scrolls.
      */
      .forest-strip {
        position: fixed;
        z-index: 0;
        left: 0;
        right: 0;
        height: 48px;
        overflow: hidden;
        color: rgba(255, 171, 92, 0.63);
        font-size: 2rem;
        line-height: 1.1;
        letter-spacing: 0.55rem;
        white-space: nowrap;
        text-align: center;
        text-shadow: 1px 2px 0 rgba(0, 0, 0, 0.3);
        pointer-events: none;
        user-select: none;
      }

      .forest-top { top: 7px; }
      .forest-bottom { bottom: 5px; }

      /*
        Circular fox stickers placed over the page background.
        Like the other decorations, they are intentionally non-interactive.
      */
      .fox-sticker {
        position: fixed;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 92px;
        height: 92px;
        border: 3px dashed var(--orange-light);
        border-radius: 50%;
        background: rgba(30, 33, 35, 0.84);
        color: var(--orange-light);
        font-size: 3.65rem;
        line-height: 1;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
        pointer-events: none;
        user-select: none;
      }

      .fox-one { top: 103px; left: 18px; transform: rotate(-10deg); }
      .fox-two { right: 18px; bottom: 99px; transform: rotate(11deg); }

      /*
        The main content panel containing the page title, document preview,
        document link, and footer message.
      */
      .portal-card {
        position: relative;
        z-index: 3;
        width: min(1150px, 100%);
        padding: 20px;
        border: 4px solid var(--orange);
        border-radius: 27px;
        background: var(--card);
        box-shadow:
          0 20px 56px rgba(0, 0, 0, 0.46),
          0 0 0 8px rgba(245, 201, 95, 0.14);
        transition: background-color 240ms ease, border-color 240ms ease;
      }

      /* Horizontally centers the fox-title-fox header arrangement. */
      .portal-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-bottom: 18px;
        text-align: center;
      }

      .portal-header h1 {
        margin: 0;
        color: var(--cream);
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1;
        letter-spacing: 0.05em;
        text-shadow: 3px 4px 0 var(--brown);
      }

      /* Decorative fox icons on either side of the title. */
      .header-fox {
        color: var(--orange-light);
        font-size: clamp(2.3rem, 5vw, 4.2rem);
        line-height: 1;
        filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.22));
      }

      /*
        Outer frame for the embedded Google Document.
        overflow: hidden keeps the rounded corners clean around the iframe.
      */
      .document-wrap {
        min-height: 720px;
        overflow: hidden;
        border: 7px solid var(--frame-outer-outline);
        border-radius: 16px;
        background: var(--frame);
        box-shadow: inset 0 0 0 4px var(--frame-inner-outline);
        transition: background-color 240ms ease, border-color 240ms ease, box-shadow 240ms ease;
      }

      /* The published Google Document preview. */
      .document-wrap iframe {
        display: block;
        width: 100%;
        height: 720px;
        border: 4px solid var(--frame-inner-outline);
        background: var(--iframe-fallback);
      }

      /* Centers the “open document” link below the embedded preview. */
      .document-button-wrap {
        display: flex;
        justify-content: center;
        margin-top: 18px;
      }

      /*
        Styled anchor that acts like a button.
        It opens the editable/shareable Google Document in another browser tab.
      */
      .document-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        padding: 0.8rem 1.3rem;
        border: 3px solid var(--cream);
        border-radius: 999px;
        color: var(--ink);
        background: var(--orange-light);
        box-shadow:
          0 5px 0 var(--brown),
          0 9px 14px rgba(0, 0, 0, 0.26);
        font-size: 1.05rem;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.02em;
        text-decoration: none;
        cursor: pointer;
        transform: translateY(0) scale(1);
        transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
      }

      /* Hover styling makes the document link feel raised and interactive. */
      .document-button:hover {
        background: var(--gold);
        box-shadow:
          0 6px 0 var(--brown),
          0 11px 18px rgba(0, 0, 0, 0.3);
        transform: translateY(-2px) scale(1.06);
      }

      /* Click feedback triggers a short squash-and-pop animation. */
      .document-button:active {
        background: var(--gold);
        animation: button-pop 260ms ease-in-out;
        box-shadow:
          0 2px 0 var(--brown),
          0 4px 8px rgba(0, 0, 0, 0.22);
      }

      /*
        Strong keyboard-focus indicator for accessibility.
        :focus-visible generally shows the outline for keyboard navigation
        without adding it after ordinary mouse clicks.
      */
      .document-button:focus-visible,
      .theme-button:focus-visible {
        outline: 4px solid var(--gold);
        outline-offset: 4px;
      }

      /* Elastic press animation used by the document button. */
      @keyframes button-pop {
        0% { transform: translateY(-2px) scale(1.06); }
        45% { transform: translateY(1px) scale(0.92); }
        75% { transform: translateY(-1px) scale(1.04); }
        100% { transform: translateY(0) scale(1); }
      }

      /* Short descriptive message beneath the document link. */
      .portal-footer {
        margin: 14px 0 0;
        color: var(--gold);
        font-size: 1rem;
        text-align: center;
      }

      /*
        Fixed dark/light-mode toggle in the upper-right corner.
        z-index: 10 keeps it accessible above all page decorations and content.
      */
      .theme-button {
        position: fixed;
        z-index: 10;
        top: 22px;
        right: 24px;
        display: inline-grid;
        place-items: center;
        width: 58px;
        height: 58px;
        padding: 0;
        border: 3px solid var(--theme-button-border);
        border-radius: 50%;
        color: var(--theme-button-icon);
        background: var(--theme-button-bg);
        box-shadow:
          0 5px 0 var(--theme-button-shadow),
          0 9px 14px rgba(0, 0, 0, 0.26);
        font-family: inherit;
        font-size: 2rem;
        line-height: 1;
        cursor: pointer;
        transform: translateY(0) rotate(0deg) scale(1);
        transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      /* Adds lift, rotation, and scale feedback on hover. */
      .theme-button:hover {
        background: var(--theme-button-hover);
        box-shadow:
          0 6px 0 var(--theme-button-shadow),
          0 11px 18px rgba(0, 0, 0, 0.3);
        transform: translateY(-2px) rotate(10deg) scale(1.08);
      }

      /* Click feedback for the theme-toggle button. */
      .theme-button:active {
        box-shadow:
          0 2px 0 var(--theme-button-shadow),
          0 4px 8px rgba(0, 0, 0, 0.22);
        animation: theme-button-pop 260ms ease-in-out;
      }

      /*
        Icon visibility reflects the action the button will take:
        - Light mode: show moon, meaning “switch to dark mode.”
        - Dark mode: show sun, meaning “switch to light mode.”
      */
      .theme-button .sun-icon { display: none; }
      html[data-theme="dark"] .theme-button .moon-icon { display: none; }
      html[data-theme="dark"] .theme-button .sun-icon { display: inline; }

      /* Elastic press animation used by the theme button. */
      @keyframes theme-button-pop {
        0% { transform: translateY(-2px) rotate(10deg) scale(1.08); }
        45% { transform: translateY(1px) rotate(-8deg) scale(0.9); }
        75% { transform: translateY(-1px) rotate(6deg) scale(1.05); }
        100% { transform: translateY(0) rotate(0deg) scale(1); }
      }

      /*
        Respect user accessibility preferences by disabling transitions
        and press animations when reduced motion is requested.
      */
      @media (prefers-reduced-motion: reduce) {
        .document-button,
        .theme-button,
        body,
        .portal-card,
        .document-wrap {
          transition: none;
        }

        .document-button:active,
        .theme-button:active {
          animation: none;
        }
      }

      /*
        Mobile layout adjustments:
        reduce outer spacing, decoration sizes, frame dimensions, and
        theme button size so the portal fits smaller screens comfortably.
      */
      @media (max-width: 760px) {
        .portal-shell { padding: 76px 21px; }
        .portal-card { padding: 12px; border-radius: 19px; }
        .portal-header { gap: 8px; margin-bottom: 12px; }
        .document-wrap { min-height: 600px; border-width: 5px; }
        .document-wrap iframe { height: 600px; border-width: 3px; }
        .document-button { width: 100%; max-width: 340px; padding: 0.9rem 1rem; }
        .corner-art { font-size: 1.55rem; }
        .forest-strip { font-size: 1.25rem; letter-spacing: 0.25rem; }
        .fox-sticker { width: 58px; height: 58px; border-width: 2px; font-size: 2.35rem; }
        .fox-one { top: 65px; left: 6px; }
        .fox-two { right: 6px; bottom: 65px; }
        .top-right { right: 68px; }
        .theme-button { top: 16px; right: 14px; width: 48px; height: 48px; border-width: 2px; font-size: 1.65rem; }
      }
    </style>
  </head>

  <body>
    <!-- Persistent control for switching between light and dark themes. -->
    <button
      class="theme-button"
      id="theme-button"
      type="button"
      aria-label="Switch to dark mode"
      aria-pressed="false"
      title="Switch to dark mode"
    >
      <!-- CSS displays one of these icons depending on the active theme. -->
      <span class="moon-icon" aria-hidden="true">🌙</span>
      <span class="sun-icon" aria-hidden="true">☀️</span>
    </button>

    <!-- Non-interactive seasonal/forest decorations around the viewport. -->
    <div class="border-decoration top-left"><div class="corner-art">🍂 ✦ 🍄<br />🌿 🐾 🌙</div></div>
    <div class="border-decoration top-right"><div class="corner-art">🌙 🐾 🌿<br />🍄 ✦ 🍂</div></div>
    <div class="border-decoration bottom-left"><div class="corner-art">🌿 🍄 ✦<br />🐾 🍂 🌙</div></div>
    <div class="border-decoration bottom-right"><div class="corner-art">✦ 🍄 🌿<br />🌙 🍂 🐾</div></div>

    <!-- Fixed decorative emoji borders at the top and bottom of the page. -->
    <div class="forest-strip forest-top">🌲 🍂 ✦ 🌿 🍄 🐾 🌲 🍂 ✦ 🌿 🍄 🐾 🌙 🌲 🍂 ✦ 🌿 🍄 🐾 🌙</div>
    <div class="forest-strip forest-bottom">🍄 🌿 🐾 ✦ 🍂 🌲 🌙 🍄 🌿 🐾 ✦ 🍂 🌲 🌙 🍄 🌿 🐾 ✦ 🍂 🌲 🌙</div>

    <!-- Decorative fox stickers placed behind the main portal card. -->
    <div class="fox-sticker fox-one">🦊</div>
    <div class="fox-sticker fox-two">🦊</div>

    <!-- Main accessible content region. -->
    <main class="portal-shell">
      <section class="portal-card" aria-label="ACC PORTAL">
        <!-- Branded portal heading. Decorative foxes are hidden from screen readers. -->
        <header class="portal-header">
          <span class="header-fox" aria-hidden="true">🦊</span>
          <h1>ACC PORTAL</h1>
          <span class="header-fox" aria-hidden="true">🦊</span>
        </header>

        <!-- Embedded published version of the Google Document. -->
        <div class="document-wrap">
          <iframe
            title="ACC PORTAL Google Document"
            src="https://docs.google.com/document/d/e/2PACX-1vQcCGyuWvcmhwIpYA8ztDqYoY43qCkuH5OBHZ7R-mb2oD5PYLzyv5bxBlbo5Nvppxu248mKJEEHFSYc/pub?embedded=true"
            loading="lazy"
          ></iframe>
        </div>

        <!-- Opens the full Google Document in a separate tab safely. -->
        <div class="document-button-wrap">
          <a
            class="document-button"
            href="https://docs.google.com/document/d/13cwpLuxjcawMyskjnR9aZV3lkp0A9Eo3QV1OdxNldok/edit?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
          >
            📄 Open in a new tab ↗
          </a>
        </div>

        <!-- Brief portal description shown below the action button. -->
        <p class="portal-footer">✦ Welcome to the fox den — your activities, slides, and updates live here. ✦</p>
      </section>
    </main>

    <script>
      /*
        Store frequently used DOM elements once, rather than querying the
        document every time the theme changes.
      */
      const themeButton = document.getElementById("theme-button");
      const root = document.documentElement;
      const themeColorMeta = document.querySelector('meta[name="theme-color"]');

      /*
        Returns the current page theme.

        Light is the default state: if data-theme is absent, the function
        deliberately treats the theme as "light".
      */
      function currentTheme() {
        return root.dataset.theme === "dark" ? "dark" : "light";
      }

      /*
        Synchronizes accessible button labels, pressed state, tooltip text,
        and the mobile browser theme color with the active visual theme.
      */
      function updateThemeButton() {
        const isDark = currentTheme() === "dark";

        themeButton.setAttribute(
          "aria-label",
          isDark ? "Switch to light mode" : "Switch to dark mode"
        );

        themeButton.setAttribute("aria-pressed", String(isDark));

        themeButton.title = isDark
          ? "Switch to light mode"
          : "Switch to dark mode";

        themeColorMeta.setAttribute(
          "content",
          isDark ? "#25282b" : "#f5e4c5"
        );
      }

      /*
        Set correct labels on first load. This is especially important if the
        earlier <head> script restored a dark theme from localStorage.
      */
      updateThemeButton();

      /*
        Toggle between themes when the user presses the button.

        Dark mode is enabled by adding data-theme="dark"; returning to light
        mode removes the attribute and lets the default :root variables apply.
        The selected value is then saved for the user's next visit.
      */
      themeButton.addEventListener("click", () => {
        const nextTheme = currentTheme() === "dark" ? "light" : "dark";

        if (nextTheme === "dark") {
          root.dataset.theme = "dark";
        } else {
          delete root.dataset.theme;
        }

        localStorage.setItem("acc-portal-theme", nextTheme);
        updateThemeButton();
      });
    </script>
  </body>
</html>
